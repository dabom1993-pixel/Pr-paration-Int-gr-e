name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire : beta (test, votre tablette) ou finale (accessible à tous)"
        type: choice
        options:
          - beta
          - finale
        default: beta

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences du SDK Android
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Installer la plateforme Android nécessaire
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Générer le wrapper Gradle
        run: gradle wrapper --gradle-version 8.7

      - name: Autoriser l'exécution de gradlew
        run: chmod +x gradlew

      # Sans clé de signature fixe, Android Gradle Plugin en génère une nouvelle
      # à chaque run -> l'APK ne peut plus s'installer par-dessus la version
      # précédente (conflit de signature). On fixe donc une clé de debug stable,
      # générée une seule fois puis réutilisée (et committée) pour tous les runs suivants.
      - name: Générer une clé de debug stable (une seule fois)
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v -keystore app/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=PI Robinetterie Debug, OU=Terrain, O=ADF, L=, S=, C=FR"
          fi

      - name: Committer la clé de debug si nouvellement générée
        run: |
          if [ -n "$(git status --porcelain app/debug.keystore)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/debug.keystore
            git commit -m "Ajout de la clé de debug stable (signature APK constante entre les builds)"
            git push
          fi

      # beta   -> application "PI Robinetterie BETA" (com.adf.pirobinetterie.beta), release "tablette-beta"
      # finale -> application "PI Robinetterie" (com.adf.pirobinetterie), release "tablette-latest"
      - name: Choisir la version
        run: |
          if [ "${{ inputs.version }}" = "finale" ]; then
            echo "TACHE=assembleFinaleDebug" >> $GITHUB_ENV
            echo "DOSSIER=app/build/outputs/apk/finale/debug" >> $GITHUB_ENV
            echo "APK=PIRobinetterie.apk" >> $GITHUB_ENV
            echo "TAG=tablette-latest" >> $GITHUB_ENV
            echo "TITRE=Version finale (tablette)" >> $GITHUB_ENV
            echo "PRERELEASE=false" >> $GITHUB_ENV
          else
            echo "TACHE=assembleBetaDebug" >> $GITHUB_ENV
            echo "DOSSIER=app/build/outputs/apk/beta/debug" >> $GITHUB_ENV
            echo "APK=PIRobinetterie-BETA.apk" >> $GITHUB_ENV
            echo "TAG=tablette-beta" >> $GITHUB_ENV
            echo "TITRE=Version BETA (test)" >> $GITHUB_ENV
            echo "PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: Compiler l'APK
        run: ./gradlew ${{ env.TACHE }} --no-daemon --stacktrace

      # Nom de fichier fixe pour que l'URL de téléchargement ne change jamais.
      - name: Préparer l'APK sous un nom stable
        run: cp ${{ env.DOSSIER }}/*.apk ${{ env.DOSSIER }}/${{ env.APK }}

      - name: Publier l'APK généré (artifact du run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.DOSSIER }}/${{ env.APK }}

      # Republie (crée ou remplace) la release à tag fixe de la version choisie :
      # https://github.com/<owner>/<repo>/releases/download/<tag>/<apk>
      # (URL utilisée par le bouton logo de l'application pour la mise à jour).
      - name: Publier/mettre à jour la release de la version
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITRE }}
          prerelease: ${{ env.PRERELEASE }}
          body: >
            APK reconstruit à chaque lancement manuel du workflow "Build APK"
            (version ${{ inputs.version }}). Toujours disponible à la même URL.
          files: ${{ env.DOSSIER }}/${{ env.APK }}
